version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  lint:
    executor: python/default
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            {% if cookiecutter.dependency_manager == 'poetry' %}
            pip install poetry && poetry install
            {% else %}
            pip install -r requirements-dev.txt
            {% endif %}
      - run: ruff check .
      - run: black --check .
      - run: mypy src

  test:
    executor: python/default
    parameters:
      python-version:
        type: string
        default: "3.11"
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            {% if cookiecutter.dependency_manager == 'poetry' %}
            pip install poetry && poetry install
            {% else %}
            pip install -r requirements-dev.txt
            {% endif %}
      - run:
          name: Run tests
          command: |
            {% if cookiecutter.testing_framework == 'pytest' %}
            {% if cookiecutter.dependency_manager == 'poetry' %}poetry run {% endif %}pytest tests/ -v --cov={{ cookiecutter.project_slug }} --cov-report=xml --cov-report=term
            {% else %}
            {% if cookiecutter.dependency_manager == 'poetry' %}poetry run {% endif %}coverage run -m unittest discover -v -s tests -p "test_*.py"
            {% if cookiecutter.dependency_manager == 'poetry' %}poetry run {% endif %}coverage xml
            {% if cookiecutter.dependency_manager == 'poetry' %}poetry run {% endif %}coverage report
            {% endif %}
      - store_artifacts:
          path: coverage.xml
          destination: coverage
      - store_test_results:
          path: coverage.xml

  security:
    executor: python/default
    steps:
      - checkout
      - run:
          name: Install dependencies and tools
          command: |
            python -m pip install --upgrade pip
            {% if cookiecutter.dependency_manager == 'poetry' %}
            pip install poetry bandit safety && poetry install && poetry export -f requirements.txt --without-hashes -o requirements-export.txt
            {% else %}
            pip install -r requirements-dev.txt bandit safety
            {% endif %}
      - run: {% if cookiecutter.dependency_manager == 'poetry' %}poetry run {% endif %}bandit -r . -ll
      - run: |
          {% if cookiecutter.dependency_manager == 'poetry' %}
          safety check --file requirements-export.txt
          {% else %}
          safety check --file requirements.txt
          {% endif %}

  build:
    executor: python/default
    steps:
      - checkout
      - run: pip install build
      - run: python -m build
      - persist_to_workspace:
          root: .
          paths:
            - dist

workflows:
  version: 2
  ci:
    jobs:
      - lint
      - test:
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12"]
      - security
      - build:
          requires:
            - lint
            - test
