name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          {% if cookiecutter.dependency_manager == 'poetry' %}
          pip install poetry
          poetry install
          {% else %}
          pip install -r requirements-dev.txt
          {% endif %}
      
      - name: Run Ruff
        run: ruff check .
      
      - name: Check formatting with Black
        run: black --check .
      
      - name: Run MyPy
        run: mypy src

  test:
    name: Test
    # Note: Using {% raw %} to escape GitHub Actions syntax from cookiecutter templating
    # This will render as ${{ matrix.os }} in the generated project
    runs-on: ${% raw %}{{ matrix.os }}{% endraw %}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      # Note: Using {% raw %} to escape GitHub Actions syntax from cookiecutter templating
      # This will render as ${{ matrix.python-version }} in the generated project
      - name: Set up Python ${% raw %}{{ matrix.python-version }}{% endraw %}
        uses: actions/setup-python@v5
        with:
          python-version: ${% raw %}{{ matrix.python-version }}{% endraw %}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          {% if cookiecutter.dependency_manager == 'poetry' %}
          pip install poetry
          poetry install
          {% else %}
          pip install -r requirements-dev.txt
          {% endif %}
      
      - name: Run tests
        run: |
          {% if cookiecutter.testing_framework == 'pytest' %}
          {% if cookiecutter.dependency_manager == 'poetry' %}poetry run {% endif %}pytest tests/ -v --cov={{ cookiecutter.project_slug }} --cov-report=xml --cov-report=term
          {% else %}
          {% if cookiecutter.dependency_manager == 'poetry' %}poetry run {% endif %}coverage run -m unittest discover -v -s tests -p "test_*.py"
          {% if cookiecutter.dependency_manager == 'poetry' %}poetry run {% endif %}coverage xml
          {% if cookiecutter.dependency_manager == 'poetry' %}poetry run {% endif %}coverage report
          {% endif %}
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          {% if cookiecutter.dependency_manager == 'poetry' %}
          pip install poetry
          poetry install
          {% else %}
          pip install -r requirements-dev.txt
          {% endif %}
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: {% if cookiecutter.dependency_manager == 'poetry' %}poetry run {% endif %}bandit -r . -ll
      
      - name: Run Safety check
        run: |
          {% if cookiecutter.dependency_manager == 'poetry' %}
          poetry export -f requirements.txt --without-hashes -o requirements-export.txt && safety check --file requirements-export.txt
          {% else %}
          safety check --file requirements.txt
          {% endif %}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Build package
        run: python -m build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/

